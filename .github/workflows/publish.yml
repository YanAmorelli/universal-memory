name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to validate without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Run tests and quality checks
    runs-on: ubuntu-latest
    outputs:
      checkout_commit: ${{ steps.validate-release.outputs.checkout_commit }}
      release_tag: ${{ steps.validate-release.outputs.release_tag }}
      protected_ref: ${{ steps.validate-release.outputs.protected_ref }}
      wheel_name: ${{ steps.validate-release.outputs.wheel_name }}
      wheel_sha256: ${{ steps.validate-release.outputs.wheel_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Fetch protected release refs
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main
          +refs/heads/dev:refs/remotes/origin/dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Verify canonical skill resources
        run: uv run python scripts/sync_official_skill_resources.py --check

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run Pyright
        run: uv run pyright

      - name: Run Pytest
        run: uv run pytest

      - name: Build the release wheel once
        run: uv build --wheel --out-dir dist --clear --no-create-gitignore

      - name: Validate release provenance and exact wheel bytes
        id: validate-release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: >-
          uv run python scripts/validate_official_skill_release.py
          --tag "$RELEASE_TAG"
          --github-output "$GITHUB_OUTPUT"

      - name: Upload the validated release wheel
        uses: actions/upload-artifact@v4
        with:
          name: universal-memory-wheel-${{ steps.validate-release.outputs.checkout_commit }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  pypi-publish:
    name: Build and publish to PyPI
    needs: checks
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # Required for OIDC authentication via Trusted Publishers
    steps:
      - name: Download the validated release wheel
        uses: actions/download-artifact@v4
        with:
          name: universal-memory-wheel-${{ needs.checks.outputs.checkout_commit }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify downloaded wheel SHA-256
        env:
          EXPECTED_WHEEL_SHA256: ${{ needs.checks.outputs.wheel_sha256 }}
          WHEEL_NAME: ${{ needs.checks.outputs.wheel_name }}
        run: >-
          printf '%s  %s\n' "$EXPECTED_WHEEL_SHA256" "dist/$WHEEL_NAME"
          | sha256sum --check --strict -

      - name: Publish the validated wheel to PyPI
        env:
          WHEEL_NAME: ${{ needs.checks.outputs.wheel_name }}
        run: uv publish "dist/$WHEEL_NAME"
