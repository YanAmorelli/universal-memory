[project]
name = "universal-memory"
version = "0.1.4"
description = "Vendor-agnostic cognitive persistence layer for AI agents."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Yan L. Amorelli", email = "dev@amorelliaoyan.com" }
]
requires-python = ">=3.12"
keywords = [
    "agent-memory",
    "ai",
    "ai-agents",
    "agent-skills",
    "claude-code",
    "codex",
    "context-engineering",
    "developer-tools",
    "llm",
    "mcp",
    "memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0",
    "rich>=15.0.0",
    "tomli-w>=1.0.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/YanAmorelli/universal-memory"
Repository = "https://github.com/YanAmorelli/universal-memory"

[project.scripts]
umem = "universal_memory.bootstrap.cli:main"
universal-memory = "universal_memory.bootstrap.cli:main"
umem-mcp = "universal_memory.bootstrap.mcp:main"

[dependency-groups]
dev = [
    "pyright>=1.1.350",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs>=1.6.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PL", "RUF", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"scripts/alpha_tester.py" = [
    "E501",
    "F841",
    "PLR0912",
    "PLR0915",
    "PLW1510",
    "RUF005",
    "RUF059",
    "S101",
    "S603",
    "S607",
]
"tests/**/*.py" = ["S101"]
"src/universal_memory/interfaces/cli/init_command.py" = ["E501"]


[tool.pyright]
include = ["src", "tests", "benchmarks"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
