site_name: Universal Memory
site_description: Vendor-agnostic cognitive persistence for AI agents.
site_url: https://docs.universal-memory.com/
repo_url: https://github.com/YanAmorelli/universal-memory
repo_name: YanAmorelli/universal-memory

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/umem-mark-light.svg
  favicon: assets/umem-favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Users:
      - Getting Started: users/getting-started.md
      - CLI Guide: users/cli.md
      - Safety And Recovery: users/safety-and-recovery.md
  - Contributors:
      - Architecture: contributors/architecture.md
      - Development Guide: contributors/development.md
      - Release Readiness: contributors/release-readiness.md
      - Alpha Validation: contributors/alpha-validation.md
  - Agents And LLMs:
      - Operating Protocol: agents/operating-protocol.md
      - MCP And Skills: agents/mcp-and-skills.md
      - Instruction Files: agents/instruction-files.md
  - Reference:
      - CLI And MCP Parity: reference/cli-mcp-parity.md
      - Skill Lifecycle: reference/skill-lifecycle.md
      - Documentation Sources: reference/documentation-sources.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
